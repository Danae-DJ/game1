<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooting game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <di class="container">
        <canvas id="canvas"></canvas>
        <span class="score-container">Score:
            <span class="score">0</span>
        </span>

        <div class="menu">
            <h2>BLOCK GAME</h2>
            <button class="button">PLAY GAME</button>
            <p>Use "A" and "B" to move left and/or right.</p>
            <p>Use the Up Arrow "↑" to fire the projectiles.</p>
            <p>Block game made by <u>Danae-DJ</u></p>
        </div>
    </div>
    
</body>
</html>
